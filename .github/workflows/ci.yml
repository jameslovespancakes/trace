name: CI

# Every push to main and every pull request: Checks -> Tests -> Result.
#   Changes   changelog checks and changed areas (Rust / npm launcher)
#   Lint      rustfmt and clippy (Linux, Windows)
#   npm       unit tests of the npm launcher and packaging
#   Test      build, the whole test suite and a smoke run (Windows, Linux, macOS)
#   Result    the single required status check (branch protection)
# Also reused by release.yml as its gate; there every job runs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # No network in tests: no automatic language-server installs (tests that need a server
  # skip without one).
  TRACE_NO_AUTO_INSTALL: "1"
  RUST_TOOLCHAIN: "1.92.0"

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Empty when the filter did not run (tags, manual runs, release gate): run everything.
      rust: ${{ steps.filter.outputs.rust || 'true' }}
      npm: ${{ steps.filter.outputs.npm || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'assets/**'
              - 'tests/**'
              - 'scripts/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'clippy.toml'
              - '.config/**'
              - '.github/workflows/ci.yml'
            npm:
              - '.github/npm/**'
              - '.github/workflows/ci.yml'
            changelog:
              - 'CHANGELOG.md'
      - name: Changelog checks
        run: |
          node --test .github/tests/changelog.test.mjs
          node .github/scripts/changelog.mjs
      - name: Require changelog update
        if: steps.filter.outcome == 'success' && steps.filter.outputs.changelog != 'true'
        run: |
          echo "::error::Update CHANGELOG.md for every pull request or main push."
          exit 1

  lint:
    name: Lint (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest }
          - { name: Windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --release --workspace --all-targets --locked -- -D warnings

  npm:
    name: npm launcher
    needs: changes
    if: needs.changes.outputs.npm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: node --test .github/npm/test/*.test.mjs

  test:
    name: Test (${{ matrix.name }})
    needs: [changes, lint]
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: Linux, os: ubuntu-latest }
          - { name: macOS, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Pinned to the workspace rust-version (Cargo.toml); this also enforces the MSRV. On
      # Windows the grammar scanners compile with the preinstalled Visual Studio cl.exe.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Build
        run: cargo build --release --workspace --locked
      - name: Tests
        run: cargo nextest run --release --workspace --locked --profile ci
      - name: Smoke run
        shell: bash
        run: |
          exe=target/release/trace
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; fi
          "$exe" --version
          "$exe" --help > /dev/null
      - name: Test report
        if: always()
        uses: test-summary/action@v2
        with:
          paths: target/nextest/ci/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.name }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  result:
    name: Result
    needs: [changes, lint, npm, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summary
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"
          # Skipped = nothing in that area changed; anything else must succeed.
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
