name: CI

# Normal Rust changes test three native platforms. Declared main release candidates build six.
# Documentation and npm-only changes stay lightweight unless they prepare a release.
# A candidate has a dated workspace-version changelog entry and no existing version tag.
# A manual main run prepares a candidate when artifacts are missing or expired.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  TRACE_NO_AUTO_INSTALL: "1"
  RUST_TOOLCHAIN: "1.92.0"

jobs:
  changes:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      release: ${{ steps.plan.outputs.release }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'assets/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'clippy.toml'
              - '.cargo/**'
              - '.config/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/ci-plan.mjs'
            changelog:
              - 'CHANGELOG.md'
      - name: Tooling and changelog checks
        run: |
          node --test .github/tests/*.test.mjs .github/npm/test/*.test.mjs
          node .github/scripts/changelog.mjs
      - name: Require changelog update
        if: steps.filter.outcome == 'success' && steps.filter.outputs.changelog != 'true'
        run: |
          echo "::error::Update CHANGELOG.md for every pull request or main push."
          exit 1
      - name: Plan
        id: plan
        env:
          RUST_CHANGED: ${{ steps.filter.outputs.rust }}
        run: node .github/scripts/ci-plan.mjs

  platforms:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TARGET: ${{ matrix.target }}
      WINDOWS_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}
      MACOS_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: ${{ matrix.lint && 'clippy,rustfmt' || '' }}
          targets: ${{ needs.changes.outputs.release == 'true' && matrix.target || '' }}
      - name: musl C toolchain
        if: needs.changes.outputs.release == 'true' && contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          key: ${{ matrix.target }}
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format and Clippy
        if: matrix.lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --profile ci --workspace --all-targets --locked -- -D warnings
      - uses: taiki-e/install-action@v2
        if: matrix.tests
        with:
          tool: cargo-nextest
      - name: Tests
        if: matrix.tests
        run: cargo nextest run --workspace --locked --cargo-profile ci --profile ci
      - name: Test binary smoke run
        if: matrix.tests
        shell: bash
        run: |
          exe=target/ci/trace
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; fi
          "$exe" --version
          "$exe" --help > /dev/null
      - uses: actions/upload-artifact@v4
        if: always() && matrix.tests
        with:
          name: junit-${{ matrix.target }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Shipping binary
        if: needs.changes.outputs.release == 'true'
        shell: bash
        run: |
          if [[ "$TARGET" == *windows-msvc ]]; then
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          cargo build --release --locked --target "$TARGET" -p trace-cli
      - name: Shipping binary smoke run
        if: needs.changes.outputs.release == 'true' && matrix.native
        shell: bash
        run: |
          exe="target/$TARGET/release/trace"
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; fi
          "$exe" --version
          "$exe" --help > /dev/null
      - name: Sign (Windows Authenticode)
        if: needs.changes.outputs.release == 'true' && contains(matrix.target, 'windows') && env.WINDOWS_SIGNING == 'true'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: target/${{ matrix.target }}/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Sign and notarize (macOS Developer ID)
        if: needs.changes.outputs.release == 'true' && contains(matrix.target, 'apple') && env.MACOS_SIGNING == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$GITHUB_RUN_ID" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$GITHUB_RUN_ID" "$keychain"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$GITHUB_RUN_ID" "$keychain"
          bin="target/$TARGET/release/trace"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$bin"
          ditto -c -k --keepParent "$bin" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Package candidate
        if: needs.changes.outputs.release == 'true'
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          version=$(node .github/scripts/release-artifacts.mjs version)
          bin="target/$TARGET/release/trace"
          if [[ "$TARGET" == *windows* ]]; then bin="$bin.exe"; fi
          name="trace-v${version}-$TARGET"
          mkdir -p release-artifact/bin "dist/$name"
          cp "$bin" release-artifact/bin/
          cp "$bin" LICENSE README.md CHANGELOG.md "dist/$name/"
          cd dist
          if [ "$ARCHIVE" = "zip" ]; then
            7z a -tzip "../release-artifact/$name.zip" "$name" > /dev/null
          else
            tar czf "../release-artifact/$name.tar.gz" "$name"
          fi
          cd ..
          node .github/scripts/release-artifacts.mjs record
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.release == 'true'
        with:
          name: release-${{ matrix.target }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  result:
    name: Result
    needs: [changes, platforms]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summary
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
