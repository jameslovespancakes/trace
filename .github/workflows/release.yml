name: Release

# Publish the exact successful CI artifacts for the current main commit. No Rust builds.
# Push a matching version tag after CI finishes. Manual runs only pack and dry-run npm.
# NPM_TOKEN needs publish rights. Optional code signing happens while CI prepares binaries.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.source.outputs.version }}
      publish: ${{ steps.source.outputs.publish }}
      prerelease: ${{ steps.source.outputs.prerelease }}
      run: ${{ steps.source.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify source and artifacts
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-source.mjs verify

  publish:
    name: Publish packages and archives
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      SOURCE_RUN: ${{ needs.verify.outputs.run }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          run-id: ${{ needs.verify.outputs.run }}
          github-token: ${{ github.token }}
      - name: Verify checksums and stage
        run: node .github/scripts/release-artifacts.mjs stage
      - name: Pack
        run: node .github/npm/scripts/pack.mjs --version "$VERSION" --binaries npm-bin --out npm-out
      - name: Recheck main and CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-source.mjs current
      - name: npm dry run
        if: needs.verify.outputs.publish != 'true'
        run: node .github/npm/scripts/publish.mjs npm-out --dry-run
      - uses: actions/attest-build-provenance@v1
        if: needs.verify.outputs.publish == 'true'
        with:
          subject-path: dist/*
      - name: Publish npm
        if: needs.verify.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node .github/npm/scripts/publish.mjs npm-out --tag "${{ needs.verify.outputs.prerelease == 'true' && 'next' || 'latest' }}"
      - name: Publish GitHub release
        if: needs.verify.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          package=$(node -p "require('./.github/npm/trace/package.json').name")
          {
            node .github/scripts/changelog.mjs "$VERSION"
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "npm install -g ${package}@${VERSION}"
            echo '```'
            echo
            echo "npm automatically selects the matching OS and CPU binary."
            echo
            echo "Binaries: https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN"
            echo "The archives contain the same binaries, with SHA256SUMS and release provenance."
          } > notes.md
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "trace $VERSION" --notes-file notes.md --verify-tag "${flags[@]}"
      - name: Summary
        if: always()
        env:
          RESULT: ${{ job.status }}
          PUBLISH: ${{ needs.verify.outputs.publish }}
        run: |
          {
            echo "## Release $VERSION"
            echo "Result: $RESULT. Publishing enabled: $PUBLISH."
            echo "Reused CI run $SOURCE_RUN for $GITHUB_SHA. No Rust rebuilds."
          } >> "$GITHUB_STEP_SUMMARY"
