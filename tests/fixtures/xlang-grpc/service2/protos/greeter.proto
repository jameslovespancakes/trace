// Fixture (round 2, grpc): an identical copy of protos/greeter.proto (same package, service
// and rpcs: the same wire methods), as microservice repositories vendor per service.
syntax = "proto3";

package helloworld;

option go_package = "example.com/helloworld";

service Greeter {
  // Unique implementation (server/server.go) -> inferred.
  rpc SayHello (HelloRequest) returns (HelloReply) {}
  // Implemented by two servers -> possible.
  rpc SayGoodbye (HelloRequest) returns (HelloReply);
  // Implemented by the Node server through a bound handler -> inferred.
  rpc SayHi (HelloRequest) returns (HelloReply);
  // Implemented by two subclasses of an abstract Python servicer -> possible.
  rpc Wave (HelloRequest) returns (HelloReply);
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}
