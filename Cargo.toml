[workspace]
resolver = "2"
members = [
    "crates/trace-core",
    "crates/trace-env",
    "crates/trace-syntax",
    "crates/trace-library",
    "crates/trace-semantic",
    "crates/trace-infer",
    "crates/trace-bridge",
    "crates/trace-analysis",
    "crates/trace-watch",
    "crates/trace-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false
license = "MIT"

[workspace.dependencies]
# Internal crates (data flow: core -> syntax -> env -> library -> semantic -> infer / bridge ->
# analysis -> host -> cli; DESIGN §0).
# New third-party dependencies are added to the member crate that needs them with an exact
# version (`foo = "=x.y.z"`), not to this table (this file is a shared interface).
trace-core = { path = "crates/trace-core" }
trace-env = { path = "crates/trace-env" }
trace-syntax = { path = "crates/trace-syntax" }
trace-library = { path = "crates/trace-library" }
trace-semantic = { path = "crates/trace-semantic" }
trace-infer = { path = "crates/trace-infer" }
trace-bridge = { path = "crates/trace-bridge" }
trace-analysis = { path = "crates/trace-analysis" }
trace-watch = { path = "crates/trace-watch" }

# Serialization, hashing, errors.
serde = { version = "1.0.228", features = ["derive"] }
# NEVER enable "preserve_order": hashes of JSON values rely on sorted keys. "float_roundtrip"
# keeps rewritten numbers (timestamps) bit-exact.
serde_json = { version = "1.0.149", features = ["float_roundtrip"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
blake3 = "1.8.7"
thiserror = "2.0.18"
anyhow = "1.0.102"

# Parallelism, filesystem, platform.
rayon = "1.12.0"
ignore = "0.4.33"
dirs = "6.0.0"
uuid = { version = "1.23.1", features = ["v4"] }
url = "2.5.8"
notify = "8.2.0"

# HTTP for language-server downloads (rustls, no native-tls).
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }

# CLI.
clap = { version = "4.6.1", features = ["derive"] }

# Syntax: ONE tree-sitter core version shared by every grammar crate.
# All grammar crates below depend only on `tree-sitter-language ^0.1` and ship
# generated parser.c (ABI 14/15) with C scanners (no C++), so they link against
# tree-sitter 0.26.x unchanged. Grammar versions are pinned exactly.
tree-sitter = "=0.26.13"
streaming-iterator = "0.1.9"
tree-sitter-python = "=0.25.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-rust = "=0.24.2"
tree-sitter-go = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-php = "=0.24.2"
tree-sitter-bash = "=0.25.1"
tree-sitter-scala = "=0.26.2"
tree-sitter-r = "=1.3.0"
tree-sitter-haskell = "=0.23.1"

# Tests only.
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = "symbols"
panic = "unwind"

[profile.dev.package."*"]
# Grammar C code and dependencies compile optimized even in debug builds (parsing speed in tests).
opt-level = 2
