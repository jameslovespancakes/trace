[package]
name = "trace-semantic"
description = "Guarded language-server and compiler backends (Pyright, TypeScript, rust-analyzer, generic LSP) mapped onto trace syntax symbols."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
trace-core.workspace = true
trace-env.workspace = true
trace-syntax.workspace = true
trace-library.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
thiserror.workspace = true
blake3.workspace = true
uuid.workspace = true
url.workspace = true
# mirror.rs honours .gitignore; fntype.rs walks syntax trees.
ignore.workspace = true
tree-sitter.workspace = true
# `registry::install` (pinned language-server downloads after explicit confirmation).
ureq.workspace = true
sha2 = "=0.10.9"
# Installer (DESIGN §1.9): archives unpacked in Rust. Exact pins, offline cache.
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
tar = "=0.4.46"
flate2 = "=1.1.10"
lzma-rs = "=0.3.0"

[dev-dependencies]
tempfile.workspace = true
